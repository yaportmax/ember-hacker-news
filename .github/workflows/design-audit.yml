name: Visual review
on:
  push:
    branches: [design/reading-refinement]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    name: Capture ${{ matrix.device }}
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    steps:
      - uses: actions/checkout@v4
      - name: Capture app flows
        env:
          AUDIT_DEVICE: ${{ matrix.device }}
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "scripts")
          import release
          phone, tablet = release.choose_devices()
          device = phone if os.environ["AUDIT_DEVICE"] == "iPhone" else tablet
          release.BUILD.mkdir(exist_ok=True)
          release.run(["xcodebuild", "test", "-project", "Ember.xcodeproj", "-scheme", "Ember", "-derivedDataPath", "build/DerivedData", "CODE_SIGNING_ALLOWED=NO", "-destination", f"platform=iOS Simulator,id={device['udid']}", "-parallel-testing-enabled", "NO", "-resultBundlePath", "build/Audit.xcresult", "-only-testing:EmberUITests/EmberUITests/testAuditMainFlows", "-only-testing:EmberUITests/EmberUITests/testAuditLargeText", "-only-testing:EmberUITests/EmberUITests/testJobsDoNotInviteComments", "-only-testing:EmberUITests/EmberUITests/testArticleAndTitleOpenBrowser"])
          PY
      - name: Export screenshots
        if: always()
        run: xcrun xcresulttool export attachments --path build/Audit.xcresult --output-path build/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-review-${{ matrix.device }}
          path: build/screenshots/
          retention-days: 3
