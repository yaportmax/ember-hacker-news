name: Visual review
on:
  push:
    branches: [design/reading-refinement, review/reading-controls, review/discussion-performance, review/spacing-settings, review/spacing-captures, review/storage-check, release/app-store, release/store-screenshots]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    name: Capture ${{ matrix.device }}
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    steps:
      - uses: actions/checkout@v4
      - name: Capture app flows
        env:
          AUDIT_DEVICE: ${{ matrix.device }}
          EMBER_LIVE_TESTS: '1'
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          sys.path.insert(0, "scripts")
          import release
          phone, tablet = release.choose_devices()
          store_captures = os.environ.get("GITHUB_REF_NAME") in {"release/app-store", "release/store-screenshots"}
          if store_captures and os.environ["AUDIT_DEVICE"] == "iPhone":
              available = json.loads(release.run(["xcrun", "simctl", "list", "devices", "available", "--json"], capture_output=True, text=True).stdout)
              candidates = [(runtime, d) for runtime, devices in available["devices"].items() if "iOS" in runtime for d in devices if d.get("isAvailable") and "iPhone" in d["name"] and "Pro Max" in d["name"]]
              if not candidates:
                  raise SystemExit("App Store captures require an available iPhone Pro Max simulator.")
              candidates.sort(key=lambda pair: tuple(int(n) for n in re.findall(r"\d+", pair[0])), reverse=True)
              phone = candidates[0][1]
          device = phone if os.environ["AUDIT_DEVICE"] == "iPhone" else tablet
          release.BUILD.mkdir(exist_ok=True)
          capture_only = os.environ.get("GITHUB_REF_NAME") == "review/spacing-captures"
          storage_only = os.environ.get("GITHUB_REF_NAME") == "review/storage-check"
          if os.environ["AUDIT_DEVICE"] == "iPhone" and not capture_only and not storage_only and not store_captures:
              release.run(["swift", "test", "-j", "1"])
          release.run(["xcrun", "simctl", "bootstatus", device["udid"], "-b"])
          tests = ["testCommentSpacingAffectsPreviewAndReading", "testStorySpacingAndPreferencePersistence", "testReviewLargeTextAndLandscape"]
          if os.environ["AUDIT_DEVICE"] == "iPhone":
              tests += ["testReadingPreferenceControls", "testStorageConfirmationKeepsBookmarks", "testReportAndUnblockFlow", "testLargeDiscussionResponsiveness", "testReviewReadingControls"]
          if capture_only:
              tests = ["testSettledTypographyScreens"]
          if storage_only:
              tests = ["testStorageConfirmationKeepsBookmarks"]
          if store_captures:
              release.run(["xcrun", "simctl", "status_bar", device["udid"], "override", "--time", "9:41", "--dataNetwork", "wifi", "--wifiMode", "active", "--wifiBars", "3", "--batteryState", "charged", "--batteryLevel", "100"])
              tests = ["testAppStoreScreenshots"]
          release.run(["xcodebuild", "test", "-project", "Ember.xcodeproj", "-scheme", "Ember", "-derivedDataPath", "build/DerivedData", "CODE_SIGNING_ALLOWED=NO", "-destination", f"platform=iOS Simulator,id={device['udid']}", "-parallel-testing-enabled", "NO", "-test-timeouts-enabled", "YES", "-default-test-execution-time-allowance", "300", "-resultBundlePath", "build/Audit.xcresult", *["-only-testing:EmberUITests/EmberUITests/" + name for name in tests]])
          PY
      - name: Export screenshots
        if: always()
        run: xcrun xcresulttool export attachments --path build/Audit.xcresult --output-path build/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-review-${{ matrix.device }}
          path: build/screenshots/
          retention-days: 7
